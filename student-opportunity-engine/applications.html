<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Student Opportunity Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .summary-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            padding: 1.5rem;
        }
        
        .summary-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        
        .summary-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            margin-top: 3rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
        }
        
        .rec-meta {
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .rec-meta span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .rec-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        @media (max-width: 992px) {
            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Injected via components.js -->
        <div id="sidebar-container"></div>
        
        <div class="main-content">
            <!-- Injected via components.js -->
            <div id="header-container"></div>
            
            <div class="page-content" style="max-width: 1200px; margin: 0 auto; width: 100%;">
                <!-- Hero Section (Dynamic) -->
                <div id="dashboard-hero-container">
                    <div class="skeleton" style="height: 120px; border-radius: var(--border-radius-lg); margin-bottom: 2rem;"></div>
                </div>

                <!-- Featured Match -->
                <div id="featured-match-container"></div>

                <!-- Recommended Opportunities Section -->
                <div class="section-header">
                    <h2 class="section-title">Recommended for you</h2>
                    <a href="internships.html" class="btn btn-outline-dark" style="font-size: 0.75rem;">View All</a>
                </div>
                <div id="recommendations-container">
                    <!-- Skeletons will be injected by JS -->
                </div>

                <!-- Skill Progress & Upcoming -->
                <div class="grid grid-cols-2 gap-4" style="margin-top: 2rem;">
                    <div>
                        <div class="section-header" style="margin-top: 0;">
                            <h2 class="section-title">Continue your roadmap</h2>
                            <a href="career-roadmap.html" class="btn btn-outline-dark" style="font-size: 0.75rem;">View Roadmap</a>
                        </div>
                        <div class="card" style="margin-bottom: 2rem;">
                            <p class="text-secondary" style="margin-bottom: 1rem;">Based on your goal, you need to complete the following skills:</p>
                            <div id="skills-container">
                                <div class="skeleton" style="height: 100px; border-radius: var(--border-radius-md);"></div>
                            </div>
                        </div>
                        
                        <div class="section-header" style="margin-top: 0;">
                            <h2 class="section-title">Skills to improve</h2>
                            <a href="skill-engine.html" class="btn btn-outline-dark" style="font-size: 0.75rem;">Manage Skills</a>
                        </div>
                        <div id="summary-cards-container">
                             <div class="skeleton" style="height: 100px; border-radius: var(--border-radius-md);"></div>
                        </div>
                    </div>
                    <div>
                        <div class="section-header" style="margin-top: 0;">
                            <h2 class="section-title">Upcoming deadlines</h2>
                            <a href="applications.html" class="btn btn-outline-dark" style="font-size: 0.75rem;">Applications</a>
                        </div>
                        <div id="upcoming-container">
                            <div class="skeleton" style="height: 200px; border-radius: var(--border-radius-md);"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
