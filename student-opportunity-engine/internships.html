<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internships & Jobs - Student Opportunity Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .filter-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            padding: 1rem;
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-select {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: var(--border-radius-sm);
            outline: none;
            flex: 1;
            min-width: 150px;
        }
        
        .filter-select:focus {
            border-color: var(--accent);
        }

        .opportunity-card {
            display: flex;
            flex-direction: column;
        }

        .opp-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .opp-title {
            font-size: 1.125rem;
            margin-bottom: 0.25rem;
        }

        .opp-org {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .opp-meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .opp-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .opp-meta-item svg {
            width: 16px;
            height: 16px;
        }

        .opp-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .opp-actions {
            margin-top: auto;
            display: flex;
            gap: 0.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        
        <div class="main-content">
            <div id="header-container"></div>
            
            <div class="page-content">
                <div class="page-header flex justify-between items-center" style="margin-bottom: 1.5rem;">
                    <div>
                        <h1 class="page-title" style="font-size: 2rem; color: var(--text-primary);">Explore Opportunities</h1>
                        <p class="page-description">Find internships, hackathons, scholarships and competitions matched to your profile.</p>
                    </div>
                </div>

                <!-- Modern Filter Chips -->
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;">
                    <button class="btn btn-primary" style="border-radius: var(--border-radius-full); padding: 0.5rem 1rem;">All</button>
                    <button class="btn btn-outline" style="border-radius: var(--border-radius-full); padding: 0.5rem 1rem; border-color: transparent; background: var(--input-bg);">Internships</button>
                    <button class="btn btn-outline" style="border-radius: var(--border-radius-full); padding: 0.5rem 1rem; border-color: transparent; background: var(--input-bg);">Jobs</button>
                    <button class="btn btn-outline" style="border-radius: var(--border-radius-full); padding: 0.5rem 1rem; border-color: transparent; background: var(--input-bg);">Hackathons</button>
                    <button class="btn btn-outline" style="border-radius: var(--border-radius-full); padding: 0.5rem 1rem; border-color: transparent; background: var(--input-bg);">Scholarships</button>
                    <button class="btn btn-outline" style="border-radius: var(--border-radius-full); padding: 0.5rem 1rem; border-color: transparent; background: var(--input-bg);">Competitions</button>
                    <button class="btn btn-outline" style="border-radius: var(--border-radius-full); padding: 0.5rem 1rem; border-color: transparent; background: var(--input-bg);">Workshops</button>
                    <button class="btn btn-outline" style="border-radius: var(--border-radius-full); padding: 0.5rem 1rem; border-color: transparent; background: var(--input-bg);">Projects</button>
                </div>

                <div class="filter-bar" style="background: transparent; border: none; padding: 0; margin-bottom: 2rem; align-items: center;">
                    <div style="flex: 1; min-width: 250px; position: relative;">
                        <svg style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-secondary);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        <input type="text" class="form-control" placeholder="Search opportunities..." style="padding-left: 2.5rem; border-radius: var(--border-radius-sm);">
                    </div>
                    <select class="filter-select" id="filter-domain">
                        <option value="">Domain</option>
                    </select>
                    <select class="filter-select" id="filter-skill">
                        <option value="">Skill</option>
                    </select>
                    <select class="filter-select" id="filter-location">
                        <option value="">Location</option>
                    </select>
                    <label style="display: flex; align-items: center; gap: 0.25rem; color: var(--text-secondary); font-size: 0.875rem; cursor: pointer;">
                        <input type="checkbox" id="filter-remote"> Remote
                    </label>
                    <button class="btn btn-primary" id="apply-filters-btn">Apply</button>
                </div>

                <div id="internships-container">
                    <!-- Skeletons / List / Error -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/internships.js"></script>
</body>
</html>
